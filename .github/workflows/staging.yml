name: staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  staging-config:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "STAGING_URL is not configured; skipping staging verification."
          fi

  verify-staging:
    needs: staging-config
    runs-on: ubuntu-latest
    if: needs.staging-config.outputs.available == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe staging
        run: curl -fsS "${{ secrets.STAGING_URL }}" >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke against staging
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
        run: npx playwright test --config=playwright.smoke.config.mjs tests/smoke/web-smoke.spec.js --reporter=list --trace=on --output=test-results
      - name: Upload staging smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-artifacts
          path: |
            test-results
          if-no-files-found: ignore
