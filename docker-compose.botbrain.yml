# BOTBRAIN — ambiente local: jogar/coletar (game) + treinar (train), sem montar Supabase.
#
#   docker compose -f docker-compose.botbrain.yml up game        # sobe o jogo em :4321
#     → abra http://localhost:4321/?botbrain=1  (bots dirigidos pela rede)
#     → jogue com a coleta ligada; os frames caem em tools/eval/data/collected.ndjson
#
#   docker compose -f docker-compose.botbrain.yml run --rm train # treina com o que houver
#     → gera public/models/bot-brain/ (recarregue o jogo pra usar o modelo novo)
#
# O node_modules do container é isolado (volume anônimo) porque os binários nativos
# (sharp, tfjs-node) são de Linux — os do seu Mac não servem dentro do container.
services:
  game:
    build:
      context: .
      dockerfile: docker/botbrain.Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # sem SUPABASE_URL/KEY → o /api/train-frames grava em arquivo local (sink de dev)

  train:
    build:
      context: .
      dockerfile: docker/botbrain.Dockerfile
    profiles: ["train"]     # não sobe no `up`; roda só via `run --rm train`
    volumes:
      - .:/app
      - /app/node_modules
    # 1) tfjs-node (fora das deps do projeto, pesado) 2) bootstrap se não houver dado
    # 3) treina com bootstrap + seus frames coletados → escreve o modelo no volume montado
    command: >
      sh -c "npm i -D @tensorflow/tfjs-node --no-audit --no-fund &&
             ([ -f tools/eval/data/bootstrap.ndjson ] || node tools/eval/bot-record.mjs 60 all) &&
             node tools/eval/bot-train.mjs --epochs=40 &&
             node tools/eval/bot-brain-check.mjs"
