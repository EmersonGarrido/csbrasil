<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mount test — arma pra frente?</title>
<style>html,body{margin:0;height:100%;background:#20242b;overflow:hidden}#hud{position:fixed;left:8px;top:8px;font:12px monospace;color:#9fe;white-space:pre;z-index:9}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="hud">carregando…</div>
<script type="module">
import * as THREE from 'three';
import { preloadCharacterAssets, buildCharacterModel } from './js/glbchars.js';
import { CHARACTERS } from './js/characters.js';

const qp = new URLSearchParams(location.search);
const CHAR = qp.get('char') || 'mst';
const WEAPON = qp.get('w') || 'awp';
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 100);
// view angle via query: side (default, pure +X profile — +Z points LEFT), front (+Z at camera), tq (3/4).
const VIEW = qp.get('view') || 'side';
if (VIEW === 'front') { cam.position.set(0, 1.3, 3.4); cam.lookAt(0, 1.05, 0); }
else if (VIEW === 'tq') { cam.position.set(1.6, 1.5, 2.6); cam.lookAt(0, 1.0, 0); }
else { cam.position.set(3.4, 1.3, 0); cam.lookAt(0, 1.05, 0); }

scene.add(new THREE.HemisphereLight(0xbcd3ff, 0x3a3320, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3,6,4); scene.add(key);
scene.add(new THREE.GridHelper(10, 20, 0x445, 0x334));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x2a2f38}));
floor.rotation.x = -Math.PI/2; scene.add(floor);

// Reference arrow = world +Z = the direction the character faces. Gun barrel should match.
const fwd = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,1.15,0), 1.4, 0x00ff00, 0.12, 0.07);
scene.add(fwd);

await preloadCharacterAssets([CHAR]);
const def = CHARACTERS.find(c => c.id === CHAR) || { id: CHAR, team:'P' };
const built = buildCharacterModel(def, { weapon:true, weaponId: WEAPON });
if (!built || !built.group) { hud.textContent = 'sem modelo '+CHAR; throw new Error('no model'); }
scene.add(built.group);
// settle into idle and hold still
if (built.ctrl && built.ctrl._to) built.ctrl._to('idle');
for (let i=0;i<10;i++){ if(built.ctrl) built.ctrl.update(1/30,0,false,0); }
built.group.updateMatrixWorld(true);

hud.textContent = `char=${CHAR} weapon=${WEAPON}\nseta verde = +Z (frente)\ncano deve apontar junto`;
renderer.render(scene, cam);
window.MOUNT_READY = true;
addEventListener('resize', ()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); renderer.render(scene,cam); });
</script>
</body>
</html>
