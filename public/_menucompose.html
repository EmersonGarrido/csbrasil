<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05090c;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { CHARACTERS } from './js/characters.js';
import { preloadCharacterAssets, buildCharacterModel } from './js/glbchars.js';
import { placeProp } from './js/mapprops.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const W = 1376, H = 768;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// céu dramático (gradiente teal->escuro) via grande esfera invertida
const skyGeo = new THREE.SphereGeometry(120, 24, 16);
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: {},
  vertexShader: 'varying vec3 p; void main(){ p=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'varying vec3 p; void main(){ float t=clamp((normalize(p).y+0.2)/1.1,0.0,1.0); vec3 top=vec3(0.02,0.10,0.13); vec3 hor=vec3(0.10,0.22,0.24); vec3 low=vec3(0.02,0.03,0.05); vec3 c=mix(low,mix(hor,top,t),smoothstep(0.0,0.6,t)); gl_FragColor=vec4(c,1.0);} ' });
scene.add(new THREE.Mesh(skyGeo, skyMat));
scene.fog = new THREE.FogExp2(0x0a1518, 0.012);

// chão
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = 0; scene.add(ground);

// luzes dramáticas: fill frio + key âmbar frontal + rim ciano por trás
scene.add(new THREE.HemisphereLight(0x2a4a55, 0x0a0d10, 0.7));
const key = new THREE.DirectionalLight(0xffcf9a, 2.1); key.position.set(4, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x39d6e0, 2.4); rim.position.set(-5, 4, -6); scene.add(rim);
const amber = new THREE.PointLight(0xffb44d, 40, 30); amber.position.set(2, 2.5, 3); scene.add(amber);

// backdrop: Congresso ao fundo (load direto, sem placeProp que depende de texturas)
try {
  const g = await new Promise((res, rej) => new GLTFLoader().load('models/props/congresso.glb?v=1', res, undefined, rej));
  const cong = g.scene; const bb = new THREE.Box3().setFromObject(cong); const s = 17 / ((bb.max.y - bb.min.y) || 1);
  cong.scale.setScalar(s); cong.position.set(1.8, 0, -20); cong.rotation.y = Math.PI;
  cong.traverse(o => { if (o.isMesh && o.material) { o.material.metalness = 0.1; } });
  scene.add(cong);
} catch (e) { console.warn('congresso', e); }

// personagens reais (models) com armas, posados aiming-idle
// contorno toon: clone do mesh em backface preto levemente inflado (cel outline) — faz o
// low-poly virar "arte de jogo".
function addOutline(root) {
  const adds = [];
  root.traverse((o) => {
    if (o.isMesh && o.geometry) {
      const om = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: 0x05070a, side: THREE.BackSide }));
      om.scale.setScalar(1.045); om.raycast = () => {}; adds.push([o, om]);
    }
  });
  for (const [o, om] of adds) o.add(om);
}
const cast = [
  { id: 'bozo', w: 'ak', x: 0.5, z: -0.2, ry: 0.6 },
  { id: 'et', w: 'm4', x: 1.9, z: 0.5, ry: 0.05 },
  { id: 'canarinho', w: 'deagle', x: 3.1, z: -0.1, ry: -0.6 },
];
await preloadCharacterAssets(cast.map(c => c.id));
for (const c of cast) {
  const def = CHARACTERS.find(d => d.id === c.id);
  const built = buildCharacterModel(def, { weaponId: c.w });
  if (!built) continue;
  built.group.position.set(c.x, 0, c.z || 0);
  built.group.rotation.y = c.ry;   // 3/4 view (silhueta mais dinâmica que de frente)
  for (let i = 0; i < 45; i++) built.ctrl.update(1 / 30, 0, false, 0);   // assenta idle (rifle-aim)
  addOutline(built.group);
  scene.add(built.group);
}

// câmera heroica: levemente baixa, afastada o suficiente pra enquadrar os três
const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 200);
cam.position.set(0.35, 1.05, 6.8); cam.lookAt(-0.25, 1.2, -3);
let f = 0; const loop = () => { renderer.render(scene, cam); if (++f < 6) requestAnimationFrame(loop); else window.COMPOSE = { ready: true }; }; loop();
</script></body></html>
