<!doctype html>
<!-- BANCADA FP (dev-only, não linkada do jogo). A SUA visão (1ª pessoa): braços + arma como
     o jogador vê. NÃO reproduz o viewmodel à mão (ele é acoplado ao game.js e divergiria) —
     roda o JOGO DE VERDADE em modo debug (?debug=1&auto=P,<char>, que cai direto na partida
     sem menu e sem pause) dentro de um iframe, e só põe por cima um painel pra trocar arma/
     personagem e AFINAR A INCLINAÇÃO ao vivo (?vmtanb/?vmpitch/?vmyaw/?vmroll do game.js).
     Achou o valor que fica bom? A gente grava no vmattach.js. Print: Cmd+Shift+4.
     A bancada de 3ª pessoa (chão + personagem + arma) continua em bancada.html. -->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bancada FP — sua visão (dev)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'ST Mono',Consolas,monospace;color:#cfe}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0}
  #panel{position:fixed;top:10px;left:10px;z-index:9;background:rgba(10,12,16,.86);border:1px solid #2a3340;
    padding:12px;border-radius:8px;display:flex;flex-direction:column;gap:7px;width:238px;font-size:13px}
  #panel h1{font-size:12px;letter-spacing:2px;color:#7fd;margin:0;text-transform:uppercase}
  #panel label{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #panel select,#panel input[type=number]{font-family:inherit;font-size:13px;background:#1b2029;color:#cfe;border:1px solid #2a3340;border-radius:5px;padding:5px 7px}
  #panel select{flex:1}
  #panel input[type=number]{width:78px}
  .chk{justify-content:flex-start!important;gap:6px}
  .sec{border-top:1px solid #2a3340;padding-top:7px;display:flex;flex-direction:column;gap:6px}
  .sec .t{color:#7fd;font-size:11px;letter-spacing:1px}
  #apply{font-family:inherit;font-size:13px;background:#2a5;border:1px solid #2a5;color:#031;border-radius:5px;padding:7px;cursor:pointer;font-weight:700}
  #status{color:#9fb;font-size:12px}
  kbd{background:#1b2029;border:1px solid #2a3340;border-radius:4px;padding:1px 5px}
  .hint{font-size:11px;color:#89a}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<iframe id="game" src="/?debug=1&auto=P,mst" allow="fullscreen"></iframe>
<div id="panel">
  <h1>Bancada FP (sua visão)</h1>
  <label>Arma <select id="wsel"></select></label>
  <label>Personagem <select id="csel"></select></label>
  <label class="chk"><input type="checkbox" id="hide"> fundo liso (esconde o mapa)</label>
  <div class="sec">
    <div class="t">INCLINAÇÃO — vazio = padrão do jogo</div>
    <label>tanBarrel (cano ↑) <input type="number" id="k_tanb" step="0.01" placeholder="0.22"></label>
    <label>pitch° (cano ↑↓) <input type="number" id="k_pitch" step="1" placeholder="0"></label>
    <label>yaw° (cano ←→) <input type="number" id="k_yaw" step="1" placeholder="0"></label>
    <label>roll° (lado) <input type="number" id="k_roll" step="1" placeholder="0"></label>
    <div class="hint">menos inclinada ≈ tanBarrel menor + roll perto de 0</div>
  </div>
  <div class="sec">
    <div class="t">MÃOS/BRAÇOS (experimental)</div>
    <label class="chk"><input type="checkbox" id="hands"> mostrar mãos/braços</label>
    <label>escala fps <input type="number" id="k_fps" step="0.02" placeholder="0.93"></label>
    <label>altura fpy <input type="number" id="k_fpy" step="0.02" placeholder="-1.48"></label>
    <label>profund. fpz <input type="number" id="k_fpz" step="0.02" placeholder=""></label>
    <button id="apply">aplicar (recarrega)</button>
    <div class="hint">a mão vem torta por padrão (rig da Mint) — tenta escala/altura</div>
  </div>
  <div id="status">carregando o jogo…</div>
  <div class="hint">print: <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd></div>
</div>
<script type="module">
import { WEAPON_IDS } from './js/weapons.js';
import { CHARACTERS } from './js/characters.js';

const fr = document.getElementById('game');
const $ = (id) => document.getElementById(id);
const wsel = $('wsel'), csel = $('csel'), hide = $('hide'), hands = $('hands'), status = $('status');

wsel.innerHTML = WEAPON_IDS.map((id) => `<option value="${id}">${id}</option>`).join('');
csel.innerHTML = CHARACTERS.map((c) => `<option value="${c.id}">${c.id}</option>`).join('');
csel.value = 'mst';

const game = () => { try { return fr.contentWindow.__game; } catch { return null; } };

function buildSrc() {
  const p = new URLSearchParams({ debug: '1', auto: `P,${csel.value}` });
  const knob = { vmtanb: $('k_tanb').value, vmpitch: $('k_pitch').value, vmyaw: $('k_yaw').value, vmroll: $('k_roll').value,
    fps: $('k_fps').value, fpy: $('k_fpy').value, fpz: $('k_fpz').value };
  for (const [k, v] of Object.entries(knob)) if (v !== '') p.set(k, v);
  if (hands.checked) p.set('hands', '1');
  return `/?${p.toString()}`;
}

function waitLive() {
  status.textContent = 'carregando o jogo…';
  return new Promise((resolve) => {
    const t0 = performance.now();
    (function poll() {
      const g = game();
      if (g && g.state === 'live') { status.textContent = 'pronto · troque/afinе no painel'; resolve(g); return; }
      if (performance.now() - t0 > 60000) { status.textContent = 'demorou pra abrir (recarregue)'; return; }
      setTimeout(poll, 200);
    })();
  });
}

function switchWeapon() { const g = game(); if (g && g._switchWeapon) { g._switchWeapon(wsel.value); if (g.player) g.player.drawUntil = 0; } }
function applyHide() { const g = game(); if (g && g.scene) g.scene.visible = !hide.checked; }
function applyState() { switchWeapon(); applyHide(); }

wsel.onchange = switchWeapon;          // troca de arma: ao vivo, sem recarregar
hide.onchange = applyHide;             // fundo liso: ao vivo
async function reload() { fr.src = buildSrc(); await waitLive(); applyState(); }
$('apply').onclick = reload;           // inclinação/mãos: precisam recarregar o jogo
csel.onchange = reload;

await waitLive();
applyState();
</script>
</body>
</html>
